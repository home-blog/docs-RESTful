<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="API마다 다른 에러 모양을 표준 형식 하나로 통일하면, 화면은 code 하나만 보고 처리할 수 있다.">
