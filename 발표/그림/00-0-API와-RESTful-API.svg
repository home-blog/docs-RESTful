<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-label="웹·앱·관리자 페이지·다른 서비스가 같은 API를 쓰는데, API는 형식이 자유로워 제각각일 수 있으므로, REST 원칙(자원은 URL, 행동은 메서드, 결과는 상태 코드)으로 통일한 것이 RESTful API다.">
<title>API와 RESTful API</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2230"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2459C2"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D7468"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B45B8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B55400"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BF2A20"/></marker></defs>
<rect x="0" y="0" width="1240" height="560" rx="18" fill="#FFFFFF"/>
<text x="620" y="40" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#5A6474" text-anchor="middle" xml:space="preserve">같은 API를 쓰는 쪽</text>
<rect x="170" y="56" width="210" height="60" rx="10" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="275" y="82" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">웹 브라우저</text>
<text x="275" y="104" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">React · Vue</text>
<line x1="275" y1="118" x2="275" y2="136" stroke="#B4BCC8" stroke-width="2"/>
<rect x="400" y="56" width="210" height="60" rx="10" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="505" y="82" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">모바일 앱</text>
<text x="505" y="104" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">iOS · Android</text>
<line x1="505" y1="118" x2="505" y2="136" stroke="#B4BCC8" stroke-width="2"/>
<rect x="630" y="56" width="210" height="60" rx="10" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="735" y="82" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">관리자 페이지</text>
<text x="735" y="104" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">운영팀 화면</text>
<line x1="735" y1="118" x2="735" y2="136" stroke="#B4BCC8" stroke-width="2"/>
<rect x="860" y="56" width="210" height="60" rx="10" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="965" y="82" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">다른 서비스</text>
<text x="965" y="104" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">외부 · 사내 시스템</text>
<line x1="965" y1="118" x2="965" y2="136" stroke="#B4BCC8" stroke-width="2"/>
<path d="M275,136 H965 M620,136 V150" fill="none" stroke="#B4BCC8" stroke-width="2"/>
<path d="M620,150 L620,168" fill="none" stroke="#5A6474" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
<rect x="40" y="176" width="500" height="344" rx="14" fill="#FFFFFF" stroke="#B4BCC8" stroke-width="2"/>
<text x="64" y="216" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve">API</text>
<text x="64" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">프로그램끼리 요청과 응답을 주고받는 방법 (형식은 자유)</text>
<text x="64" y="284" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#5A6474" text-anchor="start" xml:space="preserve">같은 &#x27;42번 글 삭제&#x27;를 만든 사람마다</text>
<rect x="60" y="296" width="460" height="118" rx="8" fill="#F4F6F9" stroke="#E3E7ED" stroke-width="1.5"/>
<text x="78" y="326" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="600" fill="#BF2A20" text-anchor="start" xml:space="preserve">POST /deletePost.do?no=42</text>
<text x="78" y="358" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="600" fill="#BF2A20" text-anchor="start" xml:space="preserve">GET  /post/remove?id=42</text>
<text x="78" y="390" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="600" fill="#BF2A20" text-anchor="start" xml:space="preserve">POST /api {&quot;action&quot;:&quot;delete&quot;,&quot;id&quot;:42}</text>
<text x="64" y="452" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#BF2A20" text-anchor="start" xml:space="preserve">쓰는 쪽은 API마다</text>
<text x="64" y="478" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#BF2A20" text-anchor="start" xml:space="preserve">문서를 찾거나 물어봐야 한다</text>
<path d="M548,348 L692,348" fill="none" stroke="#1C2230" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<text x="620" y="330" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1C2230" text-anchor="middle" xml:space="preserve">REST로 통일</text>
<text x="620" y="386" font-size="14" text-anchor="middle" xml:space="preserve"><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="600" fill="#5A6474">자원 → </tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="700" fill="#0D7468">URL</tspan></text>
<text x="620" y="412" font-size="14" text-anchor="middle" xml:space="preserve"><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="600" fill="#5A6474">행동 → </tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="700" fill="#0D7468">메서드</tspan></text>
<text x="620" y="438" font-size="14" text-anchor="middle" xml:space="preserve"><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="600" fill="#5A6474">결과 → </tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="700" fill="#0D7468">상태 코드</tspan></text>
<rect x="700" y="176" width="500" height="344" rx="14" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="724" y="216" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="700" fill="#2459C2" text-anchor="start" xml:space="preserve">RESTful API</text>
<text x="724" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">REST 원칙으로 형식을 통일한 API</text>
<text x="724" y="284" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#5A6474" text-anchor="start" xml:space="preserve">같은 &#x27;42번 글 삭제&#x27;는 하나로</text>
<rect x="720" y="296" width="460" height="118" rx="8" fill="#FFFFFF" stroke="#2459C2" stroke-width="1.5"/>
<text x="744" y="344" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="20" font-weight="700" fill="#2459C2" text-anchor="start" xml:space="preserve">DELETE /api/v1/posts/42</text>
<text x="744" y="382" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#1B7F3B" text-anchor="start" xml:space="preserve">→ 204 No Content</text>
<text x="724" y="452" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#2459C2" text-anchor="start" xml:space="preserve">주소만 보고도</text>
<text x="724" y="478" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#2459C2" text-anchor="start" xml:space="preserve">무슨 일인지 알 수 있다</text>
</svg>
