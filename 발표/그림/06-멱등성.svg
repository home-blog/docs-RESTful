<text x="310" y="76" font-size="22" text-anchor="middle" xml:space="preserve"><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#1C2230">POST /posts</tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="700" fill="#1C2230"> 를 3번 보내면</tspan></text>
<text x="310" y="106" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">보낼 때마다 새 자원이 하나씩 생긴다</text>
