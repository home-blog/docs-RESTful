<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="POST를 3번 보내면 글이 3개 생기지만, DELETE를 3번 보내도 42번 글이 없는 상태는 1번 보낸 것과 같다.">
<title>멱등성</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181D"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E5BDB"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794E"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B54708"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker></defs>
<rect x="0" y="0" width="1200" height="560" fill="#FFFFFF"/>
<rect x="40" y="30" width="540" height="460" rx="8" fill="#F6F7F9" stroke="#E8EBEF" stroke-width="1.2"/>
<text x="310" y="76" font-size="22" text-anchor="middle" xml:space="preserve"><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-weight="700" fill="#15181D">POST /posts</tspan><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" fill="#15181D"> 를 3번 보내면</tspan></text>
<text x="310" y="106" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">보낼 때마다 새 자원이 하나씩 생긴다</text>
<text x="76" y="166" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start" xml:space="preserve">1번째</text>
<path d="M140,160 L298,160" fill="none" stroke="#6B7280" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
<rect x="306" y="138" width="240" height="44" rx="8" fill="#F1F8F4" stroke="#18794E" stroke-width="1"/>
<text x="426" y="166" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#18794E" text-anchor="middle" xml:space="preserve">201 · 43번 글 생성</text>
<text x="76" y="228" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start" xml:space="preserve">2번째</text>
<path d="M140,222 L298,222" fill="none" stroke="#6B7280" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
<rect x="306" y="200" width="240" height="44" rx="8" fill="#F1F8F4" stroke="#18794E" stroke-width="1"/>
<text x="426" y="228" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#18794E" text-anchor="middle" xml:space="preserve">201 · 44번 글 생성</text>
<text x="76" y="290" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start" xml:space="preserve">3번째</text>
<path d="M140,284 L298,284" fill="none" stroke="#6B7280" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
<rect x="306" y="262" width="240" height="44" rx="8" fill="#F1F8F4" stroke="#18794E" stroke-width="1"/>
<text x="426" y="290" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#18794E" text-anchor="middle" xml:space="preserve">201 · 45번 글 생성</text>
<rect x="70" y="362" width="480" height="104" rx="8" fill="#FEF6EE" stroke="#B54708" stroke-width="1.2"/>
<text x="310" y="404" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="600" fill="#B54708" text-anchor="middle" xml:space="preserve">결과: 같은 글이 3개 생김</text>
<text x="310" y="440" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="400" fill="#15181D" text-anchor="middle" xml:space="preserve">멱등 아님 → 중복을 막아야 한다</text>
<rect x="620" y="30" width="540" height="460" rx="8" fill="#F6F7F9" stroke="#E8EBEF" stroke-width="1.2"/>
<text x="890" y="76" font-size="22" text-anchor="middle" xml:space="preserve"><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-weight="700" fill="#15181D">DELETE /posts/42</tspan><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" fill="#15181D"> 를 3번 보내면</tspan></text>
<text x="890" y="106" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">몇 번 보내도 서버 상태는 같다</text>
<text x="656" y="166" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start" xml:space="preserve">1번째</text>
<path d="M720,160 L878,160" fill="none" stroke="#6B7280" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
<rect x="886" y="138" width="240" height="44" rx="8" fill="#F1F8F4" stroke="#18794E" stroke-width="1"/>
<text x="1006" y="166" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#18794E" text-anchor="middle" xml:space="preserve">204 · 42번 글 삭제</text>
<text x="656" y="228" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start" xml:space="preserve">2번째</text>
<path d="M720,222 L878,222" fill="none" stroke="#6B7280" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
<rect x="886" y="200" width="240" height="44" rx="8" fill="#F6F7F9" stroke="#6B7280" stroke-width="1"/>
<text x="1006" y="228" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#6B7280" text-anchor="middle" xml:space="preserve">404 · 이미 없음</text>
<text x="656" y="290" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#6B7280" text-anchor="start" xml:space="preserve">3번째</text>
<path d="M720,284 L878,284" fill="none" stroke="#6B7280" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
<rect x="886" y="262" width="240" height="44" rx="8" fill="#F6F7F9" stroke="#6B7280" stroke-width="1"/>
<text x="1006" y="290" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#6B7280" text-anchor="middle" xml:space="preserve">404 · 이미 없음</text>
<rect x="650" y="362" width="480" height="104" rx="8" fill="#F1F8F4" stroke="#18794E" stroke-width="1.2"/>
<text x="890" y="404" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="600" fill="#18794E" text-anchor="middle" xml:space="preserve">결과: 42번 글 없음</text>
<text x="890" y="440" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="400" fill="#15181D" text-anchor="middle" xml:space="preserve">1번 보낸 것과 상태가 같다 → 멱등</text>
<text x="600" y="532" font-size="18" text-anchor="middle" xml:space="preserve"><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" fill="#18794E">멱등 O: </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-weight="600" fill="#15181D">GET · PUT · DELETE</tspan><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" fill="#B54708">     멱등 X: </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-weight="600" fill="#15181D">POST</tspan><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="400" fill="#6B7280">   →  글쓰기 버튼은 한 번 누르면 막아 둔다</tspan></text>
</svg>
