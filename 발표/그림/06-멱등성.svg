<text x="890" y="440" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" fill="#1C2230" text-anchor="middle" xml:space="preserve">1번 보낸 것과 상태가 같다 → 멱등</text>
<text x="600" y="532" font-size="18" text-anchor="middle" xml:space="preserve"><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="700" fill="#1B7F3B">멱등 O: </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="600" fill="#1C2230">GET · PUT · DELETE</tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="700" fill="#B55400">     멱등 X: </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="600" fill="#1C2230">POST</tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="400" fill="#5A6474">   →  글쓰기 버튼은 한 번 누르면 막아 둔다</tspan></text>
