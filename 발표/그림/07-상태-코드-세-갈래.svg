<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="서버의 처리 결과는 2xx 성공, 4xx 요청한 쪽 잘못, 5xx 서버 잘못 세 갈래로 나뉘고, 실패를 200으로 주면 안 된다.">
<title>상태 코드 세 갈래</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2230"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2459C2"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D7468"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B45B8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B55400"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BF2A20"/></marker></defs>
<rect x="0" y="0" width="1200" height="620" rx="18" fill="#FFFFFF"/>
<rect x="40" y="215" width="170" height="110" rx="14" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="125" y="265" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">클라이언트</text>
<text x="125" y="293" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">요청</text>
<rect x="280" y="215" width="190" height="110" rx="14" fill="#E2F2EF" stroke="#0D7468" stroke-width="2"/>
<text x="375" y="262" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#0D7468" text-anchor="middle" xml:space="preserve">서버</text>
<text x="375" y="292" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">처리 결과는?</text>
<path d="M212,270 L276,270" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="125" y="362" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">바디를 읽기 전에</text>
<text x="125" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">상태 코드로 결과를 안다</text>
<path d="M472,270 L535,270" fill="none" stroke="#5A6474" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M535,270 L535,105 L596,105" fill="none" stroke="#1B7F3B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<rect x="600" y="40" width="560" height="130" rx="14" fill="#E5F3E9" stroke="#1B7F3B" stroke-width="2"/>
<text x="668" y="119" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="40" font-weight="700" fill="#1B7F3B" text-anchor="middle" xml:space="preserve">2xx</text>
<text x="750" y="83" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#1B7F3B" text-anchor="start" xml:space="preserve">성공</text>
<text x="750" y="114" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="17" font-weight="500" fill="#1C2230" text-anchor="start" xml:space="preserve">200 OK · 201 Created · 204 No Content</text>
<text x="750" y="145" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">할 일 없음, 결과를 쓰면 된다</text>
<path d="M535,270 L596,270" fill="none" stroke="#B55400" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-orange)"/>
<rect x="600" y="205" width="560" height="130" rx="14" fill="#FCEFE0" stroke="#B55400" stroke-width="2"/>
<text x="668" y="284" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="40" font-weight="700" fill="#B55400" text-anchor="middle" xml:space="preserve">4xx</text>
<text x="750" y="248" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#B55400" text-anchor="start" xml:space="preserve">요청한 쪽 잘못</text>
<text x="750" y="279" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="17" font-weight="500" fill="#1C2230" text-anchor="start" xml:space="preserve">400 · 401 · 403 · 404 · 409</text>
<text x="750" y="310" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">클라이언트가 요청을 고쳐서 다시</text>
<path d="M535,270 L535,435 L596,435" fill="none" stroke="#BF2A20" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-red)"/>
