<text x="668" y="449" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="40" font-weight="700" fill="#BF2A20" text-anchor="middle" xml:space="preserve">5xx</text>
<text x="750" y="413" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#BF2A20" text-anchor="start" xml:space="preserve">서버 잘못</text>
<text x="750" y="444" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="17" font-weight="500" fill="#1C2230" text-anchor="start" xml:space="preserve">500 · 503</text>
<text x="750" y="475" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">서버가 고쳐야 한다 (잠시 후 다시)</text>
<rect x="40" y="530" width="1120" height="66" rx="12" fill="#FBE8E6" stroke="#BF2A20" stroke-width="2"/>
<circle cx="80" cy="563" r="15" fill="#FBE8E6" stroke="#BF2A20" stroke-width="2"/>
<path d="M73.25,556.25 L86.75,569.75 M86.75,556.25 L73.25,569.75" stroke="#BF2A20" stroke-width="3" stroke-linecap="round"/>
<text x="108" y="570" font-size="18" text-anchor="start" xml:space="preserve"><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="600" fill="#1C2230">하지 말 것: 실패인데 </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#BF2A20">200 OK + { &quot;success&quot;: false }</tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="400" fill="#1C2230">  →  모니터링·재시도 도구가 성공으로 착각</tspan></text>
</svg>
