<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" width="1240" height="590" role="img" aria-label="웹, 모바일 앱, 관리자 페이지, 다른 서비스가 모두 같은 API 서버를 호출하므로, 누구나 예측할 수 있는 공통 규칙이 필요하다.">
<title>여러 클라이언트가 같은 API를 쓴다</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181D"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E5BDB"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794E"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B54708"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker></defs>
<rect x="0" y="0" width="1240" height="590" fill="#FFFFFF"/>
<rect x="40" y="40" width="270" height="82" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="175" y="76" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">웹 브라우저</text>
<text x="175" y="102" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">React · Vue</text>
<path d="M312,81 L420,81 L420,245 L496,245" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<rect x="40" y="144" width="270" height="82" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="175" y="180" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">모바일 앱</text>
<text x="175" y="206" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">iOS · Android</text>
<path d="M312,185 L420,185 L420,245 L496,245" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round"/>
<rect x="40" y="248" width="270" height="82" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="175" y="284" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">관리자 페이지</text>
<text x="175" y="310" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">운영팀이 쓰는 화면</text>
<path d="M312,289 L420,289 L420,245" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round"/>
<rect x="40" y="352" width="270" height="82" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="175" y="388" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">다른 서비스</text>
<text x="175" y="414" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">외부 파트너 · 사내 시스템</text>
<path d="M312,393 L420,393 L420,245" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round"/>
<path d="M420,245 L496,245" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="430" y="228" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#2E5BDB" text-anchor="start" xml:space="preserve">HTTP 요청</text>
<rect x="500" y="130" width="320" height="230" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="660" y="172" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">API 서버</text>
<text x="660" y="198" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">하나의 API를 모두에게 제공</text>
<text x="530" y="238" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="500" fill="#15181D" text-anchor="start" xml:space="preserve">GET    /api/v1/posts</text>
<text x="530" y="266" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="500" fill="#15181D" text-anchor="start" xml:space="preserve">POST   /api/v1/posts</text>
<text x="530" y="294" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="500" fill="#15181D" text-anchor="start" xml:space="preserve">GET    /api/v1/posts/42</text>
<text x="530" y="322" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="500" fill="#15181D" text-anchor="start" xml:space="preserve">DELETE /api/v1/posts/42</text>
<path d="M822,245 L936,245" fill="none" stroke="#2B3440" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-violet)"/>
<rect x="940" y="175" width="250" height="140" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="1065" y="236" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">DB</text>
<text x="1065" y="266" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">글 · 댓글 · 회원</text>
<rect x="40" y="470" width="1150" height="96" rx="8" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="615" y="508" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#15181D" text-anchor="middle" xml:space="preserve">API를 만드는 사람과 쓰는 사람이 다르다</text>
<text x="615" y="542" font-size="17" text-anchor="middle" xml:space="preserve"><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="400" fill="#6B7280">그래서 문서를 일일이 묻지 않아도 예측할 수 있는 공통 규칙이 필요하다  →  </tspan><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" fill="#2B3440">REST</tspan></text>
</svg>
