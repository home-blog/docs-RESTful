<text x="1065" y="236" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#5B45B8" text-anchor="middle" xml:space="preserve">DB</text>
<text x="1065" y="266" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">글 · 댓글 · 회원</text>
<rect x="40" y="470" width="1150" height="96" rx="14" fill="#FFFFFF" stroke="#1C2230" stroke-width="2"/>
<text x="615" y="508" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#1C2230" text-anchor="middle" xml:space="preserve">API를 만드는 사람과 쓰는 사람이 다르다</text>
<text x="615" y="542" font-size="17" text-anchor="middle" xml:space="preserve"><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="400" fill="#5A6474">그래서 문서를 일일이 묻지 않아도 예측할 수 있는 공통 규칙이 필요하다  →  </tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="700" fill="#0D7468">REST</tspan></text>
