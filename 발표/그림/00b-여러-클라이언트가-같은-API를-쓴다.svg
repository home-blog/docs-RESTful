<text x="175" y="180" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">모바일 앱</text>
<text x="175" y="206" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">iOS · Android</text>
<path d="M312,185 L420,185 L420,245 L496,245" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="40" y="248" width="270" height="82" rx="12" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="175" y="284" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">관리자 페이지</text>
<text x="175" y="310" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">운영팀이 쓰는 화면</text>
<path d="M312,289 L420,289 L420,245" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="40" y="352" width="270" height="82" rx="12" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="175" y="388" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">다른 서비스</text>
<text x="175" y="414" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">외부 파트너 · 사내 시스템</text>
<path d="M312,393 L420,393 L420,245" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M420,245 L496,245" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="430" y="228" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#2459C2" text-anchor="start" xml:space="preserve">HTTP 요청</text>
<rect x="500" y="130" width="320" height="230" rx="14" fill="#E2F2EF" stroke="#0D7468" stroke-width="2"/>
<text x="660" y="172" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#0D7468" text-anchor="middle" xml:space="preserve">API 서버</text>
<text x="660" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">하나의 API를 모두에게 제공</text>
<text x="530" y="238" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="500" fill="#1C2230" text-anchor="start" xml:space="preserve">GET    /api/v1/posts</text>
