<text x="530" y="322" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="500" fill="#1C2230" text-anchor="start" xml:space="preserve">DELETE /api/v1/posts/42</text>
<path d="M822,245 L936,245" fill="none" stroke="#5B45B8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-violet)"/>
