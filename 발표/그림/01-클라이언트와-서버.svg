<text x="850" y="322" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="600" fill="#5B45B8" text-anchor="middle" xml:space="preserve">③ 결과</text>
<path d="M150,352 L150,440 L1050,440 L1050,352" fill="none" stroke="#BF2A20" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 7"/>
