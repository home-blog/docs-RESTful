<text x="640" y="258" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">Spring Boot</text>
<text x="640" y="305" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="500" fill="#1C2230" text-anchor="middle" xml:space="preserve">= 주방</text>
