<text x="850" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="600" fill="#5B45B8" text-anchor="middle" xml:space="preserve">② 꺼내기 · 저장</text>
