<path d="M591.9,431.9 L608.1,448.1 M608.1,431.9 L591.9,448.1" stroke="#BF2A20" stroke-width="3" stroke-linecap="round"/>
<text x="600" y="495" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="600" fill="#BF2A20" text-anchor="middle" xml:space="preserve">클라이언트는 DB를 직접 열지 않고, 항상 API를 거친다</text>
</svg>
