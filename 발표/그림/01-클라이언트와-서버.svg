<text x="150" y="305" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="500" fill="#1C2230" text-anchor="middle" xml:space="preserve">= 손님</text>
<rect x="520" y="150" width="240" height="200" rx="14" fill="#E2F2EF" stroke="#0D7468" stroke-width="2"/>
