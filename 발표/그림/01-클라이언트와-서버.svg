<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 95 1200 435" width="1200" height="435" role="img" aria-label="클라이언트는 요청을 보내고, 서버가 DB를 다룬 뒤 응답한다. 클라이언트는 DB를 직접 열지 않는다.">
<title>클라이언트와 서버</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181D"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E5BDB"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794E"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B54708"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker></defs>
<rect x="0" y="95" width="1200" height="435" fill="#FFFFFF"/>
<rect x="40" y="150" width="220" height="200" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="150" y="222" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="28" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">클라이언트</text>
<text x="150" y="258" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">브라우저 · 앱</text>
<text x="150" y="305" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="500" fill="#15181D" text-anchor="middle" xml:space="preserve">요청을 보낸다</text>
<rect x="520" y="150" width="240" height="200" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="640" y="222" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="28" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">서버</text>
<text x="640" y="258" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">Spring Boot</text>
<text x="640" y="305" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="500" fill="#15181D" text-anchor="middle" xml:space="preserve">요청을 처리한다</text>
<rect x="514" y="168" width="4" height="164" rx="2" fill="#2E5BDB"/>
<text x="516" y="140" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">API</text>
<rect x="940" y="150" width="220" height="200" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="1050" y="222" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">데이터베이스</text>
<text x="1050" y="258" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">글 · 댓글 · 회원</text>
<text x="1050" y="305" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="500" fill="#15181D" text-anchor="middle" xml:space="preserve">데이터를 저장한다</text>
<path d="M262,215 L504,215" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="383" y="198" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">1. 요청</text>
<path d="M506,290 L264,290" fill="none" stroke="#2B3440" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-teal)"/>
<text x="385" y="322" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">4. 응답</text>
<path d="M762,215 L936,215" fill="none" stroke="#2B3440" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-violet)"/>
<text x="850" y="198" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">2. 조회 · 저장</text>
<path d="M938,290 L764,290" fill="none" stroke="#2B3440" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-violet)"/>
<text x="850" y="322" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">3. 결과</text>
<path d="M150,352 L150,440 L1050,440 L1050,352" fill="none" stroke="#B42318" stroke-width="1.24" stroke-linejoin="round" stroke-dasharray="8 7"/>
<path d="M591.0,431.0 L609.0,449.0 M609.0,431.0 L591.0,449.0" stroke="#B42318" stroke-width="2" stroke-linecap="round"/>
<text x="600" y="495" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#B42318" text-anchor="middle" xml:space="preserve">클라이언트는 DB를 직접 열지 않고, 항상 API를 거친다</text>
</svg>
