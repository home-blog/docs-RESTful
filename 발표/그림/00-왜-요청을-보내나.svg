<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-label="화면에 보이는 데이터는 서버의 DB에 있으므로, 사용자의 동작 하나하나가 서버로 보내는 HTTP 요청 하나가 된다.">
<title>왜 요청을 보내나</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2230"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2459C2"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D7468"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B45B8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B55400"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BF2A20"/></marker></defs>
<rect x="0" y="0" width="1240" height="600" rx="18" fill="#FFFFFF"/>
<text x="40" y="46" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#5A6474" text-anchor="start" xml:space="preserve">사용자가 화면에서 하는 일</text>
<text x="420" y="46" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#5A6474" text-anchor="start" xml:space="preserve">클라이언트가 보내는 요청</text>
<text x="800" y="46" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#5A6474" text-anchor="start" xml:space="preserve">서버가 하는 일 → 응답</text>
<rect x="40" y="72" width="320" height="72" rx="12" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="60" y="115" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="600" fill="#1C2230" text-anchor="start" xml:space="preserve">블로그 첫 화면을 연다</text>
<path d="M362,108 L414,108" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<rect x="420" y="72" width="330" height="72" rx="12" fill="#FFFFFF" stroke="#B4BCC8" stroke-width="2"/>
<text x="440" y="115" font-size="18" text-anchor="start" xml:space="preserve"><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#2459C2">GET</tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="500" fill="#1C2230"> /api/v1/posts</tspan></text>
<path d="M752,108 L794,108" fill="none" stroke="#0D7468" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-teal)"/>
<rect x="800" y="72" width="400" height="72" rx="12" fill="#E2F2EF" stroke="#0D7468" stroke-width="2"/>
<text x="820" y="115" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#1C2230" text-anchor="start" xml:space="preserve">DB에서 글 목록 조회</text>
<text x="1180" y="115" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#1B7F3B" text-anchor="end" xml:space="preserve">200 + 글 목록</text>
<rect x="40" y="168" width="320" height="72" rx="12" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="60" y="211" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="600" fill="#1C2230" text-anchor="start" xml:space="preserve">42번 글을 누른다</text>
<path d="M362,204 L414,204" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<rect x="420" y="168" width="330" height="72" rx="12" fill="#FFFFFF" stroke="#B4BCC8" stroke-width="2"/>
<text x="440" y="211" font-size="18" text-anchor="start" xml:space="preserve"><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#2459C2">GET</tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="500" fill="#1C2230"> /api/v1/posts/42</tspan></text>
<path d="M752,204 L794,204" fill="none" stroke="#0D7468" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-teal)"/>
<rect x="800" y="168" width="400" height="72" rx="12" fill="#E2F2EF" stroke="#0D7468" stroke-width="2"/>
<text x="820" y="211" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#1C2230" text-anchor="start" xml:space="preserve">42번 글 조회</text>
<text x="1180" y="211" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#1B7F3B" text-anchor="end" xml:space="preserve">200 + 글 내용</text>
<rect x="40" y="264" width="320" height="72" rx="12" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="60" y="307" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="600" fill="#1C2230" text-anchor="start" xml:space="preserve">글을 쓰고 저장한다</text>
<path d="M362,300 L414,300" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<rect x="420" y="264" width="330" height="72" rx="12" fill="#FFFFFF" stroke="#B4BCC8" stroke-width="2"/>
<text x="440" y="307" font-size="18" text-anchor="start" xml:space="preserve"><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#2459C2">POST</tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="500" fill="#1C2230"> /api/v1/posts</tspan></text>
<path d="M752,300 L794,300" fill="none" stroke="#0D7468" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-teal)"/>
<rect x="800" y="264" width="400" height="72" rx="12" fill="#E2F2EF" stroke="#0D7468" stroke-width="2"/>
<text x="820" y="307" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#1C2230" text-anchor="start" xml:space="preserve">DB에 새 글 저장</text>
<text x="1180" y="307" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#1B7F3B" text-anchor="end" xml:space="preserve">201 + 새 글 주소</text>
<rect x="40" y="360" width="320" height="72" rx="12" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="60" y="403" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="600" fill="#1C2230" text-anchor="start" xml:space="preserve">내 글을 삭제한다</text>
<path d="M362,396 L414,396" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<rect x="420" y="360" width="330" height="72" rx="12" fill="#FFFFFF" stroke="#B4BCC8" stroke-width="2"/>
<text x="440" y="403" font-size="18" text-anchor="start" xml:space="preserve"><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#2459C2">DELETE</tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="500" fill="#1C2230"> /api/v1/posts/42</tspan></text>
<path d="M752,396 L794,396" fill="none" stroke="#0D7468" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-teal)"/>
<rect x="800" y="360" width="400" height="72" rx="12" fill="#E2F2EF" stroke="#0D7468" stroke-width="2"/>
<text x="820" y="403" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#1C2230" text-anchor="start" xml:space="preserve">DB에서 42번 글 삭제</text>
<text x="1180" y="403" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#1B7F3B" text-anchor="end" xml:space="preserve">204</text>
<rect x="40" y="470" width="1160" height="100" rx="14" fill="#F4F6F9" stroke="#E3E7ED" stroke-width="2"/>
<text x="620" y="510" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#1C2230" text-anchor="middle" xml:space="preserve">화면에 보이는 글 · 댓글 · 회원 정보는 사용자 기기가 아니라 서버의 DB에 있다</text>
<text x="620" y="544" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">그래서 화면은 데이터가 필요할 때마다 서버에 요청을 보내 데이터를 받아 오거나 바꾼다</text>
</svg>
