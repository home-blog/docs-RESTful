<text x="62" y="392" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="700" fill="#6941C6" text-anchor="start" xml:space="preserve">    &quot;totalPages&quot;: 3</text>
<text x="62" y="420" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="700" fill="#6941C6" text-anchor="start" xml:space="preserve">  }</text>
<text x="62" y="448" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="400" fill="#15181D" text-anchor="start" xml:space="preserve">}</text>
