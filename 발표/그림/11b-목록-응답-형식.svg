<line x1="620" y1="331" x2="656" y2="331" stroke="#5B45B8" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="664" y="336" font-size="15" text-anchor="start" xml:space="preserve"><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#5B45B8">size</tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="400" fill="#1C2230">  한 묶음에 몇 개</tspan></text>
<line x1="620" y1="359" x2="656" y2="359" stroke="#5B45B8" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="664" y="364" font-size="15" text-anchor="start" xml:space="preserve"><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#5B45B8">totalElements</tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="400" fill="#1C2230">  전체 글 수</tspan></text>
<line x1="620" y1="387" x2="656" y2="387" stroke="#5B45B8" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="664" y="392" font-size="15" text-anchor="start" xml:space="preserve"><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#5B45B8">totalPages</tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="400" fill="#1C2230">  전체 묶음 수 → 마지막 쪽 번호</tspan></text>
<text x="664" y="440" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#5A6474" text-anchor="start" xml:space="preserve">화면 표시</text>
