<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" width="1240" height="590" role="img" aria-label="목록 응답은 이번 묶음의 글(content)과 페이지 정보(page)를 함께 주고, 화면은 페이지 정보로 페이지 번호와 다음 버튼을 그린다.">
<title>목록 응답 형식</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181D"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E5BDB"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794E"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B54708"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker></defs>
<rect x="0" y="0" width="1240" height="590" fill="#FFFFFF"/>
<text x="40" y="50" font-size="19" text-anchor="start" xml:space="preserve"><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" fill="#6B7280">요청  </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-weight="700" fill="#2E5BDB">GET /api/v1/posts?page=1&amp;size=20</tspan></text>
<rect x="40" y="76" width="600" height="410" rx="8" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="62" y="112" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="400" fill="#15181D" text-anchor="start" xml:space="preserve">{</text>
<text x="62" y="140" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="700" fill="#2B3440" text-anchor="start" xml:space="preserve">  &quot;content&quot;: [</text>
<text x="62" y="168" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="400" fill="#15181D" text-anchor="start" xml:space="preserve">    { &quot;id&quot;: 37, &quot;title&quot;: &quot;부산 맛집&quot;, ... },</text>
<text x="62" y="196" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="400" fill="#15181D" text-anchor="start" xml:space="preserve">    { &quot;id&quot;: 36, &quot;title&quot;: &quot;제주 여행&quot;, ... },</text>
<text x="62" y="224" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">    ... 모두 20개</text>
<text x="62" y="252" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="700" fill="#2B3440" text-anchor="start" xml:space="preserve">  ],</text>
<text x="62" y="280" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="700" fill="#6941C6" text-anchor="start" xml:space="preserve">  &quot;page&quot;: {</text>
