<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" width="1240" height="590" role="img" aria-label="목록 응답은 이번 묶음의 글(content)과 페이지 정보(page)를 함께 주고, 화면은 페이지 정보로 페이지 번호와 다음 버튼을 그린다.">
<title>목록 응답 형식</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2230"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2459C2"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D7468"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B45B8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B55400"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BF2A20"/></marker></defs>
<rect x="0" y="0" width="1240" height="590" rx="18" fill="#FFFFFF"/>
<text x="40" y="50" font-size="19" text-anchor="start" xml:space="preserve"><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="700" fill="#5A6474">요청  </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#2459C2">GET /api/v1/posts?page=1&amp;size=20</tspan></text>
<rect x="40" y="76" width="600" height="410" rx="14" fill="#FFFFFF" stroke="#0D7468" stroke-width="2"/>
<text x="62" y="112" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve">{</text>
<text x="62" y="140" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#0D7468" text-anchor="start" xml:space="preserve">  &quot;content&quot;: [</text>
<text x="62" y="168" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve">    { &quot;id&quot;: 37, &quot;title&quot;: &quot;부산 맛집&quot;, ... },</text>
<text x="62" y="196" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve">    { &quot;id&quot;: 36, &quot;title&quot;: &quot;제주 여행&quot;, ... },</text>
<text x="62" y="224" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">    ... 모두 20개</text>
<text x="62" y="252" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#0D7468" text-anchor="start" xml:space="preserve">  ],</text>
<text x="62" y="280" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#5B45B8" text-anchor="start" xml:space="preserve">  &quot;page&quot;: {</text>
<text x="62" y="308" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#5B45B8" text-anchor="start" xml:space="preserve">    &quot;number&quot;: 1,</text>
<text x="62" y="336" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#5B45B8" text-anchor="start" xml:space="preserve">    &quot;size&quot;: 20,</text>
<text x="62" y="364" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#5B45B8" text-anchor="start" xml:space="preserve">    &quot;totalElements&quot;: 57,</text>
<text x="62" y="392" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#5B45B8" text-anchor="start" xml:space="preserve">    &quot;totalPages&quot;: 3</text>
<text x="62" y="420" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="700" fill="#5B45B8" text-anchor="start" xml:space="preserve">  }</text>
<text x="62" y="448" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="16" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve">}</text>
<path d="M626,140 H650 V224 H626" fill="none" stroke="#0D7468" stroke-width="2"/>
<text x="664" y="178" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#0D7468" text-anchor="start" xml:space="preserve">content: 이번 묶음의 글 목록</text>
<text x="664" y="202" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">최대 size개, 결과가 없으면 빈 배열 []</text>
