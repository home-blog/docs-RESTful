<text x="963" y="442" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1C2230" text-anchor="middle" xml:space="preserve">›</text>
<text x="1000" y="442" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#1C2230" text-anchor="start" xml:space="preserve">2 / 3쪽</text>
