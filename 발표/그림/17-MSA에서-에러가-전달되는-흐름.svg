<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" role="img" aria-label="post-service의 404가 comment-service와 게이트웨이를 거쳐 같은 상태 코드와 에러 형식으로 클라이언트에 전달되고, 응답이 없으면 503이나 504가 된다.">
<title>MSA에서 에러가 전달되는 흐름</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181D"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E5BDB"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794E"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B54708"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker></defs>
<rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>
<rect x="20" y="30" width="220" height="56" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="130" y="65" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">클라이언트</text>
<line x1="130" y1="88" x2="130" y2="520" stroke="#D3D8DF" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="340" y="30" width="220" height="56" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="450" y="65" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">API Gateway</text>
<line x1="450" y1="88" x2="450" y2="520" stroke="#D3D8DF" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="670" y="30" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="780" y="65" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="17" font-weight="700" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">comment-service</text>
<line x1="780" y1="88" x2="780" y2="520" stroke="#D3D8DF" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="980" y="30" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="1090" y="65" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="17" font-weight="700" fill="#15181D" text-anchor="middle" xml:space="preserve">post-service</text>
<line x1="1090" y1="88" x2="1090" y2="520" stroke="#D3D8DF" stroke-width="2" stroke-dasharray="5 6"/>
<path d="M130,140 L444,140" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="290.0" y="128" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="700" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">POST /api/v1/posts/42/comments</text>
<rect x="470" y="165" width="190" height="34" rx="17" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1"/>
<text x="565" y="188" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">JWT 확인 OK</text>
<path d="M450,240 L774,240" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="615.0" y="228" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="700" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">POST /api/v1/posts/42/comments</text>
<path d="M780,300 L1084,300" fill="none" stroke="#2B3440" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-teal)"/>
<text x="935.0" y="288" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="700" fill="#2B3440" text-anchor="middle" xml:space="preserve">GET /api/v1/posts/42</text>
<rect x="1100" y="318" width="130" height="34" rx="8" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1"/>
<text x="1165" y="341" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle" xml:space="preserve">42번 글 없음</text>
<path d="M1090,380 L786,380" fill="none" stroke="#B54708" stroke-width="1.55" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ah-orange)"/>
<text x="935.0" y="368" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="700" fill="#B54708" text-anchor="middle" xml:space="preserve">404  POST_NOT_FOUND</text>
<path d="M780,430 L456,430" fill="none" stroke="#B54708" stroke-width="1.55" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ah-orange)"/>
<text x="615.0" y="418" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="700" fill="#B54708" text-anchor="middle" xml:space="preserve">404  POST_NOT_FOUND</text>
<path d="M450,480 L136,480" fill="none" stroke="#B54708" stroke-width="1.55" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ah-orange)"/>
<text x="290.0" y="468" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="700" fill="#B54708" text-anchor="middle" xml:space="preserve">404  POST_NOT_FOUND</text>
<rect x="30" y="540" width="580" height="100" rx="8" fill="#FEF6EE" stroke="#B54708" stroke-width="1.2"/>
<text x="50" y="574" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#B54708" text-anchor="start" xml:space="preserve">에러 형식이 모든 서비스에서 같으면</text>
<text x="50" y="600" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#15181D" text-anchor="start" xml:space="preserve">상태 코드와 code가 그대로 전달된다</text>
<text x="50" y="624" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">→ 클라이언트는 어느 서비스에서 났는지 몰라도 처리 가능</text>
<rect x="630" y="540" width="580" height="100" rx="8" fill="#FEF3F2" stroke="#B42318" stroke-width="1.2"/>
<text x="650" y="574" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#B42318" text-anchor="start" xml:space="preserve">post-service가 응답하지 않으면</text>
<text x="650" y="600" font-size="16" text-anchor="start" xml:space="preserve"><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="400" fill="#15181D">꺼져 있음 → </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-weight="700" fill="#B42318">503</tspan><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="400" fill="#15181D">   제한 시간 초과 → </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-weight="700" fill="#B42318">504</tspan></text>
<text x="650" y="624" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">그대로 500을 주지 말고 원인에 맞는 코드로</text>
</svg>
