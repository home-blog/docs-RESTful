<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" role="img" aria-label="post-service의 404가 comment-service와 게이트웨이를 거쳐 같은 상태 코드와 에러 형식으로 클라이언트에 전달되고, 응답이 없으면 503이나 504가 된다.">
<title>MSA에서 에러가 전달되는 흐름</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2230"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2459C2"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D7468"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B45B8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B55400"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BF2A20"/></marker></defs>
<rect x="0" y="0" width="1240" height="660" rx="18" fill="#FFFFFF"/>
<rect x="20" y="30" width="220" height="56" rx="12" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="130" y="65" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">클라이언트</text>
<line x1="130" y1="88" x2="130" y2="520" stroke="#B4BCC8" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="340" y="30" width="220" height="56" rx="12" fill="#E2F2EF" stroke="#0D7468" stroke-width="2"/>
<text x="450" y="65" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#0D7468" text-anchor="middle" xml:space="preserve">API Gateway</text>
<line x1="450" y1="88" x2="450" y2="520" stroke="#B4BCC8" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="670" y="30" width="220" height="56" rx="12" fill="#FFFFFF" stroke="#2459C2" stroke-width="2"/>
<text x="780" y="65" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="17" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">comment-service</text>
<line x1="780" y1="88" x2="780" y2="520" stroke="#B4BCC8" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="980" y="30" width="220" height="56" rx="12" fill="#FFFFFF" stroke="#1C2230" stroke-width="2"/>
<text x="1090" y="65" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="17" font-weight="700" fill="#1C2230" text-anchor="middle" xml:space="preserve">post-service</text>
<line x1="1090" y1="88" x2="1090" y2="520" stroke="#B4BCC8" stroke-width="2" stroke-dasharray="5 6"/>
<path d="M130,140 L444,140" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="290.0" y="128" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">POST /api/v1/posts/42/comments</text>
<rect x="470" y="165" width="190" height="34" rx="17" fill="#FFFFFF" stroke="#0D7468" stroke-width="1.5"/>
<text x="565" y="188" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#0D7468" text-anchor="middle" xml:space="preserve">토큰 확인 OK</text>
<path d="M450,240 L774,240" fill="none" stroke="#2459C2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="615.0" y="228" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">POST /api/v1/posts/42/comments</text>
<path d="M780,300 L1084,300" fill="none" stroke="#0D7468" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-teal)"/>
<text x="935.0" y="288" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="700" fill="#0D7468" text-anchor="middle" xml:space="preserve">GET /api/v1/posts/42</text>
<rect x="1100" y="318" width="130" height="34" rx="8" fill="#FFFFFF" stroke="#B4BCC8" stroke-width="1.5"/>
<text x="1165" y="341" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#5A6474" text-anchor="middle" xml:space="preserve">42번 글 없음</text>
<path d="M1090,380 L786,380" fill="none" stroke="#B55400" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ah-orange)"/>
<text x="935.0" y="368" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="700" fill="#B55400" text-anchor="middle" xml:space="preserve">404  POST_NOT_FOUND</text>
<path d="M780,430 L456,430" fill="none" stroke="#B55400" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ah-orange)"/>
<text x="615.0" y="418" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="700" fill="#B55400" text-anchor="middle" xml:space="preserve">404  POST_NOT_FOUND</text>
<path d="M450,480 L136,480" fill="none" stroke="#B55400" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ah-orange)"/>
<text x="290.0" y="468" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="700" fill="#B55400" text-anchor="middle" xml:space="preserve">404  POST_NOT_FOUND</text>
<rect x="30" y="540" width="580" height="100" rx="12" fill="#FCEFE0" stroke="#B55400" stroke-width="2"/>
<text x="50" y="574" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#B55400" text-anchor="start" xml:space="preserve">에러 형식이 모든 서비스에서 같으면</text>
<text x="50" y="600" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve">상태 코드와 code가 그대로 전달된다</text>
<text x="50" y="624" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">→ 클라이언트는 어느 서비스에서 났는지 몰라도 처리 가능</text>
<rect x="630" y="540" width="580" height="100" rx="12" fill="#FBE8E6" stroke="#BF2A20" stroke-width="2"/>
<text x="650" y="574" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#BF2A20" text-anchor="start" xml:space="preserve">post-service가 응답하지 않으면</text>
<text x="650" y="600" font-size="16" text-anchor="start" xml:space="preserve"><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="400" fill="#1C2230">꺼져 있음 → </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#BF2A20">503</tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="400" fill="#1C2230">   제한 시간 초과 → </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#BF2A20">504</tspan></text>
<text x="650" y="624" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">그대로 500을 주지 말고 원인에 맞는 코드로</text>
</svg>
