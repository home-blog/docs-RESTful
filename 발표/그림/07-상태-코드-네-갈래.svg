<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="서버의 처리 결과는 2xx 성공, 3xx 리다이렉트, 4xx 클라이언트 오류, 5xx 서버 오류 네 갈래로 나뉘고, 실패를 200으로 주면 안 된다.">
<title>상태 코드 네 갈래</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181D"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E5BDB"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794E"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B54708"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker></defs>
<rect x="0" y="0" width="1200" height="640" fill="#FFFFFF"/>
<rect x="40" y="215" width="170" height="110" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="125" y="265" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">클라이언트</text>
<text x="125" y="293" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">요청</text>
<rect x="280" y="215" width="190" height="110" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="375" y="262" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">서버</text>
<text x="375" y="292" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">처리 결과</text>
<path d="M212,270 L276,270" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="125" y="362" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">바디를 읽기 전에</text>
<text x="125" y="384" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">상태 코드로 결과를 안다</text>
<path d="M472,270 L535,270" fill="none" stroke="#6B7280" stroke-width="1.55" stroke-linejoin="round"/>
<path d="M535,270 L535,78 L596,78" fill="none" stroke="#18794E" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<rect x="600" y="24" width="560" height="108" rx="8" fill="#F1F8F4" stroke="#18794E" stroke-width="1.2"/>
<text x="668" y="91" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="36" font-weight="700" fill="#18794E" text-anchor="middle" xml:space="preserve">2xx</text>
<text x="750" y="60" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#18794E" text-anchor="start" xml:space="preserve">성공</text>
<text x="750" y="87" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="500" fill="#15181D" text-anchor="start" xml:space="preserve">200 OK · 201 Created · 204 No Content</text>
<text x="750" y="114" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">요청한 작업이 처리됨</text>
<path d="M535,270 L535,204 L596,204" fill="none" stroke="#2B3440" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-violet)"/>
<rect x="600" y="150" width="560" height="108" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="668" y="217" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="36" font-weight="700" fill="#2B3440" text-anchor="middle" xml:space="preserve">3xx</text>
<text x="750" y="186" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#2B3440" text-anchor="start" xml:space="preserve">리다이렉트</text>
<text x="750" y="213" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="500" fill="#15181D" text-anchor="start" xml:space="preserve">301 · 302 · 304 Not Modified</text>
<text x="750" y="240" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">다른 주소로 이동 / 캐시를 그대로 사용 (API에선 드묾)</text>
<path d="M535,270 L535,330 L596,330" fill="none" stroke="#B54708" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-orange)"/>
<rect x="600" y="276" width="560" height="108" rx="8" fill="#FEF6EE" stroke="#B54708" stroke-width="1.2"/>
<text x="668" y="343" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="36" font-weight="700" fill="#B54708" text-anchor="middle" xml:space="preserve">4xx</text>
<text x="750" y="312" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#B54708" text-anchor="start" xml:space="preserve">클라이언트 오류</text>
<text x="750" y="339" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="500" fill="#15181D" text-anchor="start" xml:space="preserve">400 · 401 · 403 · 404 · 409</text>
<text x="750" y="366" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">요청을 고쳐서 다시 보내야 함</text>
<path d="M535,270 L535,456 L596,456" fill="none" stroke="#B42318" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-red)"/>
<rect x="600" y="402" width="560" height="108" rx="8" fill="#FEF3F2" stroke="#B42318" stroke-width="1.2"/>
<text x="668" y="469" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="36" font-weight="700" fill="#B42318" text-anchor="middle" xml:space="preserve">5xx</text>
<text x="750" y="438" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#B42318" text-anchor="start" xml:space="preserve">서버 오류</text>
<text x="750" y="465" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="16" font-weight="500" fill="#15181D" text-anchor="start" xml:space="preserve">500 · 502 · 503 · 504</text>
<text x="750" y="492" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">서버 쪽 문제, 클라이언트는 잠시 후 재시도</text>
<rect x="40" y="548" width="1120" height="66" rx="8" fill="#FEF3F2" stroke="#B42318" stroke-width="1.2"/>
<path d="M72.5,573.5 L87.5,588.5 M87.5,573.5 L72.5,588.5" stroke="#B42318" stroke-width="2" stroke-linecap="round"/>
<text x="108" y="588" font-size="18" text-anchor="start" xml:space="preserve"><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" fill="#15181D">하지 말 것: 실패인데 </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-weight="700" fill="#B42318">200 OK + { &quot;success&quot;: false }</tspan><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="400" fill="#15181D">  →  모니터링·재시도·캐시는 상태 코드만 보고 성공으로 처리</tspan></text>
</svg>
