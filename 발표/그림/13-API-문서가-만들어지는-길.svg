<text x="135" y="142" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle" xml:space="preserve">@GetMapping</text>
<text x="135" y="164" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle" xml:space="preserve">@Schema</text>
