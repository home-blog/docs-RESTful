<rect x="30" y="378" width="1140" height="58" rx="8" fill="#F6F7F9" stroke="#E8EBEF" stroke-width="1.2"/>
<text x="600" y="414" font-size="18" text-anchor="middle" xml:space="preserve"><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" fill="#15181D">좋은 문서에 꼭  </tspan><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="500" fill="#6B7280">메서드 + URL · 인증 · 요청 예시 · 응답 예시 · 에러 코드 표</tspan></text>
