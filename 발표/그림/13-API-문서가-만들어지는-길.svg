<rect x="330" y="230" width="230" height="110" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="445" y="274" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">Spring REST Docs</text>
<text x="445" y="304" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#15181D" text-anchor="middle" xml:space="preserve">코드와 어긋나지 않음</text>
<path d="M562,285 L956,285" fill="none" stroke="#2B3440" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-violet)"/>
