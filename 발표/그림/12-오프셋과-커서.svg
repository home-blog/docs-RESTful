<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="오프셋은 앞의 글을 세며 건너뛰어 쪽 번호로 이동하고, 커서는 마지막으로 본 글 다음부터 바로 가져온다.">
<title>오프셋과 커서</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181D"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E5BDB"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794E"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B54708"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker></defs>
<rect x="0" y="0" width="1200" height="600" fill="#FFFFFF"/>
<rect x="30" y="30" width="555" height="490" rx="8" fill="#F6F7F9" stroke="#E8EBEF" stroke-width="1.2"/>
<text x="307" y="70" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="600" fill="#15181D" text-anchor="middle" xml:space="preserve">오프셋 (쪽 번호)</text>
<text x="307" y="100" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="17" font-weight="600" fill="#6B7280" text-anchor="middle" xml:space="preserve">GET /posts?page=2&amp;size=20</text>
<rect x="615" y="30" width="555" height="490" rx="8" fill="#F6F7F9" stroke="#E8EBEF" stroke-width="1.2"/>
<text x="892" y="70" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="600" fill="#15181D" text-anchor="middle" xml:space="preserve">커서 (마지막으로 본 위치)</text>
<text x="892" y="100" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="17" font-weight="600" fill="#6B7280" text-anchor="middle" xml:space="preserve">GET /posts?cursor=981&amp;size=20</text>
<rect x="60" y="125" width="230" height="70" rx="8" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="175" y="155" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#15181D" text-anchor="middle" xml:space="preserve">0쪽</text>
<text x="175" y="179" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">1~20번째 글</text>
<rect x="60" y="205" width="230" height="70" rx="8" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="175" y="235" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#15181D" text-anchor="middle" xml:space="preserve">1쪽</text>
<text x="175" y="259" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">21~40번째 글</text>
<rect x="60" y="285" width="230" height="70" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="175" y="315" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">2쪽</text>
<text x="175" y="339" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">41~60번째 글</text>
<rect x="60" y="365" width="230" height="46" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2" stroke-dasharray="6 6"/>
<text x="175" y="394" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="middle" xml:space="preserve">3쪽 …</text>
<path d="M302,128 H314 V272 H302" fill="none" stroke="#B54708" stroke-width="2.5"/>
<text x="328" y="194" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#B54708" text-anchor="start" xml:space="preserve">건너뛴다 (40개)</text>
<text x="328" y="218" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">앞의 글을 세면서 넘김</text>
<path d="M380,320 L296,320" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="390" y="326" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2E5BDB" text-anchor="start" xml:space="preserve">이만큼 가져온다</text>
<text x="60" y="456" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#18794E" text-anchor="start" xml:space="preserve">장점: 원하는 쪽으로 바로 이동 (게시판)</text>
<text x="60" y="486" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#B54708" text-anchor="start" xml:space="preserve">단점: 뒤쪽일수록 느리고, 새 글이 오면 겹칠 수 있다</text>
<rect x="645" y="125" width="230" height="150" rx="8" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="760" y="192" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#15181D" text-anchor="middle" xml:space="preserve">이미 본 글</text>
<text x="760" y="218" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">1000번 ~ 981번</text>
<line x1="635" y1="280" x2="885" y2="280" stroke="#2B3440" stroke-width="3" stroke-dasharray="8 5"/>
<text x="895" y="286" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#2B3440" text-anchor="start" xml:space="preserve">커서 = 981</text>
<rect x="645" y="285" width="230" height="70" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="760" y="315" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">980번 ~ 961번</text>
<text x="760" y="339" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">이번에 가져올 20개</text>
<rect x="645" y="365" width="230" height="46" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2" stroke-dasharray="6 6"/>
<text x="760" y="394" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="middle" xml:space="preserve">…</text>
<text x="895" y="192" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#15181D" text-anchor="start" xml:space="preserve">세지 않고</text>
<text x="895" y="216" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">981번 바로 다음부터</text>
<path d="M985,330 L881,330" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="995" y="336" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2E5BDB" text-anchor="start" xml:space="preserve">이만큼</text>
<text x="645" y="456" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#18794E" text-anchor="start" xml:space="preserve">장점: 데이터가 많아도 빠르다 (무한 스크롤)</text>
<text x="645" y="486" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#B54708" text-anchor="start" xml:space="preserve">단점: 5쪽으로 바로 가기는 어렵다</text>
<text x="600" y="568" font-size="18" text-anchor="middle" xml:space="preserve"><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" fill="#15181D">안전장치  </tspan><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="500" fill="#6B7280">size 최댓값 (예: 100) · 기본 정렬 · 정렬할 수 있는 칸 제한</tspan></text>
</svg>
