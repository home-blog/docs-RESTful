<text x="40" y="650" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#5A6474" text-anchor="start" xml:space="preserve">장점: 서비스마다 따로 배포·확장      단점: 서비스 사이가 네트워크 호출이라 지연·장애를 처리해야 한다</text>
<text x="40" y="678" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve">클라이언트가 보내는 요청(URL·메서드)은 단일 서버와 똑같다</text>
