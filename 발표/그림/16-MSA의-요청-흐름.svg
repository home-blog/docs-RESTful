<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="MSA에서는 API 게이트웨이가 인증과 라우팅을 맡고, 기능별 서비스가 각자 DB를 가지며, 서비스끼리도 REST API로 통신한다.">
<title>MSA의 요청 흐름</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181D"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E5BDB"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3440"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18794E"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B54708"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
<text x="40" y="44" font-size="19" text-anchor="start" xml:space="preserve"><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600" fill="#6B7280">요청  </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-weight="700" fill="#2E5BDB">POST /api/v1/posts/42/comments</tspan><tspan font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="400" fill="#6B7280">   42번 글에 댓글 작성</tspan></text>
<rect x="30" y="290" width="160" height="110" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="110" y="340" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">클라이언트</text>
<text x="110" y="366" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">브라우저 · 앱</text>
<rect x="240" y="150" width="270" height="400" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="375" y="190" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">API Gateway</text>
<text x="375" y="216" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">외부 요청이 들어오는 단일 입구</text>
<text x="262" y="262" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#15181D" text-anchor="start" xml:space="preserve">1. 인증</text>
<text x="262" y="286" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">JWT 확인, 실패하면 401</text>
<text x="262" y="334" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#15181D" text-anchor="start" xml:space="preserve">2. 라우팅 (경로 → 서비스)</text>
<text x="262" y="364" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="13" font-weight="700" fill="#2E5BDB" text-anchor="start" xml:space="preserve">/posts/*/comments → comment</text>
<text x="262" y="390" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="13" font-weight="400" fill="#15181D" text-anchor="start" xml:space="preserve">/posts/**         → post</text>
<text x="262" y="416" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="13" font-weight="400" fill="#15181D" text-anchor="start" xml:space="preserve">/members/**       → member</text>
<text x="262" y="466" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">그 밖에: 요청 로그, 요청 수 제한(429),</text>
<text x="262" y="486" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">뒤쪽 장애 시 502 · 503 · 504</text>
<path d="M192,320 L236,320" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<rect x="600" y="90" width="270" height="120" rx="8" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="735" y="140" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="18" font-weight="700" fill="#15181D" text-anchor="middle" xml:space="preserve">post-service</text>
<text x="735" y="168" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">/posts/**</text>
<rect x="1010" y="110" width="190" height="80" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="1105" y="156" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">post DB</text>
<path d="M872,150 L1006,150" fill="none" stroke="#D3D8DF" stroke-width="1.24" stroke-linejoin="round" marker-end="url(#ah-line)"/>
<rect x="600" y="280" width="270" height="120" rx="8" fill="#F3F6FD" stroke="#2E5BDB" stroke-width="1.2"/>
<text x="735" y="330" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="18" font-weight="700" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">comment-service</text>
<text x="735" y="358" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">/posts/{id}/comments</text>
<rect x="1010" y="300" width="190" height="80" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="1105" y="346" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">comment DB</text>
<path d="M872,340 L1006,340" fill="none" stroke="#2B3440" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-violet)"/>
<rect x="600" y="470" width="270" height="120" rx="8" fill="#FFFFFF" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="735" y="520" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="18" font-weight="700" fill="#15181D" text-anchor="middle" xml:space="preserve">member-service</text>
<text x="735" y="548" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">/members/**</text>
<rect x="1010" y="490" width="190" height="80" rx="8" fill="#F6F7F9" stroke="#D3D8DF" stroke-width="1.2"/>
<text x="1105" y="536" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="600" fill="#2B3440" text-anchor="middle" xml:space="preserve">member DB</text>
<path d="M872,530 L1006,530" fill="none" stroke="#D3D8DF" stroke-width="1.24" stroke-linejoin="round" marker-end="url(#ah-line)"/>
<text x="938" y="330" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="14" font-weight="700" fill="#2B3440" text-anchor="middle" xml:space="preserve">5. INSERT</text>
<path d="M512,320 L596,320" fill="none" stroke="#2E5BDB" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<text x="554" y="306" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#2E5BDB" text-anchor="middle" xml:space="preserve">3. 전달</text>
<path d="M690,278 L690,214" fill="none" stroke="#2B3440" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-teal)"/>
<path d="M780,214 L780,278" fill="none" stroke="#2B3440" stroke-width="1.55" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah-teal)"/>
<text x="800" y="238" font-family="'JetBrains Mono','D2Coding',Consolas,'Pretendard',monospace" font-size="13" font-weight="700" fill="#2B3440" text-anchor="start" xml:space="preserve">4. GET /api/v1/posts/42</text>
<text x="800" y="258" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start" xml:space="preserve">HTTP 호출 → 200 또는 404</text>
<path d="M596,370 L514,370" fill="none" stroke="#18794E" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<path d="M236,370 L194,370" fill="none" stroke="#18794E" stroke-width="1.55" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<text x="110" y="432" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#18794E" text-anchor="middle" xml:space="preserve">6. 201 Created</text>
<text x="110" y="454" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle" xml:space="preserve">또는 4xx · 5xx</text>
<text x="40" y="650" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="start" xml:space="preserve">장점: 서비스마다 따로 배포·확장      단점: 서비스 사이가 네트워크 호출이라 지연·장애를 처리해야 한다</text>
<text x="40" y="678" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#15181D" text-anchor="start" xml:space="preserve">클라이언트가 보내는 요청(URL·메서드)은 단일 서버와 똑같다</text>
</svg>
