<text x="735" y="330" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="18" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">comment-service</text>
<text x="735" y="358" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">/posts/{id}/comments</text>
<rect x="1010" y="300" width="190" height="80" rx="12" fill="#EEEAFA" stroke="#5B45B8" stroke-width="2"/>
