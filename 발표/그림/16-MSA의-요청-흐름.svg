<path d="M872,340 L1006,340" fill="none" stroke="#5B45B8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-violet)"/>
<rect x="600" y="470" width="270" height="120" rx="14" fill="#FFFFFF" stroke="#B4BCC8" stroke-width="2"/>
<text x="735" y="520" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="18" font-weight="700" fill="#1C2230" text-anchor="middle" xml:space="preserve">member-service</text>
<text x="735" y="548" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="14" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">/members/**</text>
<rect x="1010" y="490" width="190" height="80" rx="12" fill="#EEEAFA" stroke="#5B45B8" stroke-width="2"/>
