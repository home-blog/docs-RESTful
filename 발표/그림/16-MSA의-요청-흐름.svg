<text x="800" y="258" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">HTTP 호출 → 200 또는 404</text>
<path d="M596,370 L514,370" fill="none" stroke="#1B7F3B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<path d="M236,370 L194,370" fill="none" stroke="#1B7F3B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-green)"/>
