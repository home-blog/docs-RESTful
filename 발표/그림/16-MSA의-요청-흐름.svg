<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="MSA에서는 API 게이트웨이가 인증과 라우팅을 맡고, 기능별 서비스가 각자 DB를 가지며, 서비스끼리도 REST API로 통신한다.">
<title>MSA의 요청 흐름</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C2230"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6474"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2459C2"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D7468"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B45B8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F3B"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B55400"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BF2A20"/></marker></defs>
<rect x="0" y="0" width="1240" height="700" rx="18" fill="#FFFFFF"/>
<text x="40" y="44" font-size="19" text-anchor="start" xml:space="preserve"><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="700" fill="#5A6474">요청  </tspan><tspan font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-weight="700" fill="#2459C2">POST /api/v1/posts/42/comments</tspan><tspan font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="400" fill="#5A6474">   42번 글에 댓글 작성</tspan></text>
<rect x="30" y="290" width="160" height="110" rx="14" fill="#EAF0FB" stroke="#2459C2" stroke-width="2"/>
<text x="110" y="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" fill="#2459C2" text-anchor="middle" xml:space="preserve">클라이언트</text>
<text x="110" y="366" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">브라우저 · 앱</text>
<rect x="240" y="150" width="270" height="400" rx="14" fill="#E2F2EF" stroke="#0D7468" stroke-width="2"/>
<text x="375" y="190" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#0D7468" text-anchor="middle" xml:space="preserve">API Gateway</text>
<text x="375" y="216" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="middle" xml:space="preserve">외부 요청이 들어오는 단일 입구</text>
<text x="262" y="262" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve">① 인증</text>
<text x="262" y="286" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">토큰 확인, 실패하면 401</text>
<text x="262" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1C2230" text-anchor="start" xml:space="preserve">② 라우팅 (경로 → 서비스)</text>
<text x="262" y="364" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="13" font-weight="700" fill="#2459C2" text-anchor="start" xml:space="preserve">/posts/*/comments → comment</text>
<text x="262" y="390" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="13" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve">/posts/**         → post</text>
<text x="262" y="416" font-family="'JetBrains Mono','D2Coding',Consolas,'Noto Sans KR',monospace" font-size="13" font-weight="400" fill="#1C2230" text-anchor="start" xml:space="preserve">/members/**       → member</text>
<text x="262" y="466" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">그 밖에: 요청 로그, 요청 수 제한(429),</text>
<text x="262" y="486" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#5A6474" text-anchor="start" xml:space="preserve">뒤쪽 장애 시 502 · 503 · 504</text>
